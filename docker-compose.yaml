# 벨루 docker-compose.yaml을 기반으로 한다. 비밀값은 .env에만 둔다.
services:
  app:
    build: .
    image: archi-studio:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-8000}
      ORIGIN: ${ORIGIN}
      BODY_SIZE_LIMIT: 4M
      NODE_EXTRA_CA_CERTS: /run/certs/school-ca.crt
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ${SCHOOL_CA_PATH:?SCHOOL_CA_PATH must be set in .env}:/run/certs/school-ca.crt:ro
