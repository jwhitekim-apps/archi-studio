openapi: 3.1.0
info:
  title: Archi Studio API
  version: 0.1.0
  description: |
    Archi Studio의 HTTP API 계약. 근거는 `openspec/changes/archi-studio-api-spec`의 스펙 7개와 design.md다.
    모든 경로는 `/api/...` 아래에 있고, 논문은 앱 내부 UUID `id`로 가리킨다.
    translation, paper-analysis, briefing은 요약 수준이며 세부 필드는 구현 전에 보완한다.

    공통 규칙:
    - 공개 경로는 `GET /api/health`, `POST /api/auth/signup`, `POST /api/auth/login`뿐이다. 그 밖의 `/api` 요청은 세션이 없으면 경로가 있든 없든 401 `unauthenticated`다.
    - 세션은 활동 기준으로 마지막 요청 후 30일 유지된다. 요청 중 토큰이 갱신되면 쿠키 유효기간도 그 시점부터 다시 30일이 된다. 승인 여부는 보호 요청마다 확인한다.
    - 출처(Origin)가 다른 쓰기 요청(POST, PUT, PATCH, DELETE)은 403 `forbidden_origin`으로 거부하며 본문은 공통 오류 형식이다.
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: zotero
  - name: papers
  - name: notes
  - name: translation
  - name: analysis
  - name: briefing

paths:
  /api/health:
    get:
      tags: [auth]
      summary: 상태 확인 (공개, 사용자·DB 정보 없음)
      security: []
      responses:
        '200':
          description: 서버가 응답한다. 사용자나 DB 정보는 담지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/auth/signup:
    post:
      tags: [auth]
      summary: 가입 (승인 전 상태로 생성, 세션 미발급)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: 가입 성공. 세션 쿠키를 설정하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: pending_approval
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          $ref: '#/components/responses/EmailTaken'

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인 (httpOnly, SameSite=Lax 세션 쿠키, 마지막 요청 후 30일)
      description: 같은 IP에서 15분 안에 5번 실패하면 이후 시도를 거부한다. 제한 상태는 서버 재시작 후에도 유지된다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: 로그인 성공. 세션 쿠키를 설정한다.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/PendingApproval'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (세션 무효화, 쿠키 삭제)
      responses:
        '204':
          description: 로그아웃 성공. 같은 쿠키로 보낸 다음 요청은 401이 된다.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/me:
    get:
      tags: [auth]
      summary: 현재 사용자 조회
      responses:
        '200':
          description: 로그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/zotero/connect:
    get:
      tags: [zotero]
      summary: Zotero OAuth1 연결 시작
      responses:
        '302':
          description: Zotero 인증 URL로 리다이렉트한다.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          $ref: '#/components/responses/ZoteroUnavailable'

  /api/zotero/callback:
    get:
      tags: [zotero]
      summary: Zotero OAuth1 연결 완료 (Zotero가 호출하는 콜백)
      description: |
        성공하면 서재 화면(`/library`)으로 리다이렉트한다. 그 밖의 결과는 설정 화면으로 리다이렉트하고 `zotero` 쿼리로 이유를 알린다.
        `/settings?zotero=denied`(사용자가 승인을 거부함), `/settings?zotero=error`(연결 시간 초과, 토큰 불일치, 교환 실패),
        `/settings?zotero=in_use`(같은 Zotero 계정을 다른 사용자가 이미 연결함).
        저장된 Zotero 자격 정보는 어떤 API 응답에도 포함되지 않는다.
      parameters:
        - name: oauth_token
          in: query
          schema:
            type: string
        - name: oauth_verifier
          in: query
          schema:
            type: string
      responses:
        '302':
          description: 서재 화면(성공) 또는 설정 화면(거부)으로 리다이렉트한다.
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/zotero/status:
    get:
      tags: [zotero]
      summary: Zotero 연결 상태 조회
      responses:
        '200':
          description: '연결 전에는 `{ "connected": false }`만 돌려준다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoteroStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/zotero/sync:
    post:
      tags: [zotero]
      summary: 증분 동기화 (첫 동기화는 전체)
      responses:
        '200':
          description: 동기화 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/ZoteroNotConnected'
        '502':
          $ref: '#/components/responses/ZoteroUnavailable'

  /api/zotero/connection:
    delete:
      tags: [zotero]
      summary: 연결 해제 (저장된 Zotero 자격 정보 삭제, 동기화된 논문은 유지)
      responses:
        '204':
          description: 해제 성공. 이후 동기화 요청은 `zotero_not_connected`가 된다.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/papers:
    get:
      tags: [papers]
      summary: 논문 목록과 검색 (기본 정렬은 최근 동기화 순)
      parameters:
        - name: query
          in: query
          description: 제목, 저자 검색
          schema:
            type: string
        - name: collection
          in: query
          description: 컬렉션 키
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: 이전 응답의 `nextCursor`
          schema:
            type: string
      responses:
        '200':
          description: 논문 목록. 서재가 비어 있으면 `items`는 빈 배열이다.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaperListItem'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/papers/webpage:
    post:
      tags: [papers]
      summary: URL로 webpage 논문 추가 (Zotero에 항목 생성)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '201':
          description: 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/ZoteroNotConnected'
        '502':
          $ref: '#/components/responses/ZoteroUnavailable'

  /api/papers/{id}:
    parameters:
      - $ref: '#/components/parameters/PaperId'
    get:
      tags: [papers]
      summary: 논문 상세 (논문 허브 화면의 데이터)
      responses:
        '200':
          description: 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PaperNotFound'
    delete:
      tags: [papers]
      summary: 논문 삭제 (Zotero 휴지통으로 이동, 연결된 번역·분석 이력도 함께 삭제)
      responses:
        '204':
          description: 삭제 성공. 이후 상세 요청은 404가 된다.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PaperNotFound'
        '409':
          $ref: '#/components/responses/ZoteroNotConnected'
        '502':
          $ref: '#/components/responses/ZoteroUnavailable'

  /api/papers/{id}/file:
    parameters:
      - $ref: '#/components/parameters/PaperId'
    get:
      tags: [papers]
      summary: 원문 첨부(PDF 또는 HTML) 제공
      description: 브라우저 문서 뷰어에서 바로 열 수 있어야 한다. `Content-Type`은 첨부 종류를 따른다.
      responses:
        '200':
          description: 첨부 본문
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FileNotFound'
        '409':
          $ref: '#/components/responses/ZoteroNotConnected'
        '502':
          $ref: '#/components/responses/ZoteroUnavailable'

  /api/collections:
    get:
      tags: [papers]
      summary: 컬렉션 목록
      responses:
        '200':
          description: 컬렉션 배열
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/papers/{id}/memo:
    parameters:
      - $ref: '#/components/parameters/PaperId'
    get:
      tags: [notes]
      summary: 메모 조회
      responses:
        '200':
          description: 메모가 없으면 `markdown`은 빈 문자열, `updatedAt`은 null이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PaperNotFound'
        '409':
          $ref: '#/components/responses/ZoteroNotConnected'
        '502':
          $ref: '#/components/responses/ZoteroUnavailable'
    put:
      tags: [notes]
      summary: 메모 저장 (멱등, Zotero 자식 노트 `zotero-insight:memo`)
      description: |
        같은 논문에 여러 번 저장해도 마지막 본문 하나만 유지하고 Zotero 노트도 하나만 둔다.
        빈 문자열을 저장하면 메모 노트를 삭제한다. 본문은 1 MB를 넘을 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown:
                  type: string
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PaperNotFound'
        '409':
          $ref: '#/components/responses/ZoteroNotConnected'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/ZoteroUnavailable'

  /api/translate:
    post:
      tags: [translation]
      summary: 영→한 스트리밍 번역
      description: |
        번역문을 `text/plain` 청크로 스트리밍한다(SSE 아님). 같은 사용자가 같은 `text`를 이미 번역했다면
        AI를 다시 호출하지 않고 저장된 결과를 같은 형식으로 스트리밍한다. 완료 후 이력에 저장한다.
        같은 문장도 다른 논문에서 다시 요청하면 이력 행을 새로 만든다. 저장된 번역을 재사용하더라도
        요청의 `paperId`가 그 `text`의 기존 이력에 없는 논문이면 그 논문의 이력 행을 하나 더 저장한다.
        `paperId`는 선택 값이다. 있으면 이력에 그 논문의 내부 `id`를 함께 저장하고(논문이 삭제되면 이 이력도 함께 삭제된다),
        없으면 논문과 무관하게 동작한다. 없는 논문이거나 다른 사용자의 논문이면 404 `paper_not_found`를 돌려주며 AI를 호출하지 않는다.
        모델이 첫 글자를 보내기 전에 실패하면 스트리밍을 시작하지 않고 502·503 JSON 오류를 돌려준다. 스트림이 시작된 뒤 실패하면
        연결을 오류로 끝내고(본문에 오류 문장을 섞지 않는다) 이력에 저장하지 않는다. 요청자가 연결을 끊어도 저장하지 않는다.
        요청 본문은 64 KiB를 넘으면 413이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: 앞뒤 공백을 제거한 길이가 1~5000자여야 한다. 공백 없는 한 토큰이면 word, 아니면 sentence로 저장한다.
                paperId:
                  type: string
                  format: uuid
                  description: 선택 값. 번역을 연결할 내 논문의 내부 id.
      responses:
        '200':
          description: 번역문 스트림
          headers:
            X-Cache:
              description: 저장된 번역을 돌려주면 `HIT`, 모델로 새로 번역하면 `MISS`.
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PaperNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          $ref: '#/components/responses/AiUnavailable'
        '503':
          $ref: '#/components/responses/AiNotConfigured'

  /api/translate/history:
    get:
      tags: [translation]
      summary: 번역 이력 (최신순)
      description: 최신순으로 앞에서부터 `limit`개를 돌려준다. 쪽 넘김은 없다. 다른 사용자의 논문 id로 거르면 404가 아니라 빈 목록이다.
      parameters:
        - name: paperId
          in: query
          description: 선택 값. 주면 그 논문에 연결된 번역만 걸러낸다. uuid 형식이 아니면 400 `invalid_request`.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: 돌려줄 최대 개수. 범위를 벗어나거나 정수가 아니면 400 `invalid_request`.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 이력 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TranslationRecord'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/papers/{id}/analysis:
    parameters:
      - $ref: '#/components/parameters/PaperId'
    post:
      tags: [analysis]
      summary: 논문 분석 요청 (이미 있으면 저장된 결과를 돌려줌)
      description: |
        PDF 또는 Semantic Scholar 정보를 바탕으로 요약과 저널 점수를 만든다. AI에는 초록(없으면 제목과 DOI)만 보낸다.
        Semantic Scholar가 실패해도 PDF가 있으면 PDF만으로 분석한다. AI가 실패하거나, PDF가 없는데 Semantic Scholar가 실패하면 502이고 저장하지 않는다.
        같은 논문을 동시에 두 번 요청해도 저장되는 행은 하나이고 두 응답은 같다.
      responses:
        '200':
          description: 분석 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PaperNotFound'
        '422':
          $ref: '#/components/responses/NoSourceForAnalysis'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
    get:
      tags: [analysis]
      summary: 저장된 분석 조회
      responses:
        '200':
          description: 저장된 분석
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AnalysisNotFound'

  /api/briefings:
    get:
      tags: [briefing]
      summary: 브리핑 목록 (최신순, 읽기 전용)
      description: 브리핑은 앱 API로 만들거나 수정하거나 삭제할 수 없다. 이 경로의 `POST` 등 쓰기 메서드는 405를 돌려준다.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 30
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 브리핑 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BriefingListItem'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/briefings/{id}:
    get:
      tags: [briefing]
      summary: 브리핑 상세 (본문과 언급된 논문 id)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 브리핑 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BriefingNotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: archi_session
      description: Supabase Auth 세션을 담는 httpOnly, SameSite=Lax 쿠키. 쿠키 이름은 구현에서 확정한다.

  parameters:
    PaperId:
      name: id
      in: path
      required: true
      description: 논문의 앱 내부 식별자(UUID). `itemKey`와 `s2PaperId`는 경로에 쓰지 않는다.
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      description: 모든 오류 응답의 공통 본문. `code`는 기계가 읽는 영문 식별자, `message`는 한국어 설명이다.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [invalid_request]
            message:
              type: string
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    User:
      type: object
      required: [id, email, zoteroConnected]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        zoteroConnected:
          type: boolean
    ZoteroStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        zoteroUsername:
          type: string
        lastSyncedAt:
          type: [string, 'null']
          format: date-time
    SyncResult:
      type: object
      required: [added, updated, removed, syncedAt]
      properties:
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        syncedAt:
          type: string
          format: date-time
    PaperListItem:
      type: object
      required: [id, title, authors, year, collections, hasPdf, hasMemo]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: 저장된 제목이 null이면 빈 문자열 `""`로 돌려준다.
        authors:
          type: array
          items:
            type: string
        year:
          type: [integer, 'null']
          description: 저장된 연도 문자열에서 처음 나오는 네 자리 숫자를 정수로 돌려준다. 없거나 비어 있으면 null이다.
        collections:
          type: array
          items:
            type: string
          description: 컬렉션 키 배열
        hasPdf:
          type: boolean
        hasMemo:
          type: boolean
    PaperDetail:
      allOf:
        - $ref: '#/components/schemas/PaperListItem'
        - type: object
          required: [itemKey, s2PaperId, attachment, translationCount, analysisCount]
          properties:
            itemKey:
              type: [string, 'null']
              description: Zotero 항목 키. 사용자(라이브러리) 안에서만 유일하다.
            s2PaperId:
              type: [string, 'null']
              description: Semantic Scholar 논문 ID
            attachment:
              type: object
              required: [type]
              properties:
                type:
                  type: [string, 'null']
                  enum: [pdf, html, null]
            translationCount:
              type: integer
              description: 이 논문에 연결된 번역 개수
            analysisCount:
              type: integer
              description: 이 논문에 연결된 분석 개수
    Collection:
      type: object
      required: [key, name, parentKey, paperCount]
      properties:
        key:
          type: string
        name:
          type: string
        parentKey:
          type: [string, 'null']
        paperCount:
          type: integer
    Memo:
      type: object
      required: [markdown, updatedAt]
      properties:
        markdown:
          type: string
        updatedAt:
          type: [string, 'null']
          format: date-time
    TranslationRecord:
      type: object
      required: [id, sourceText, translatedText, type, paperId, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 이력 행의 id. 저장소의 `archi_translations.id`도 uuid다.
        sourceText:
          type: string
        translatedText:
          type: string
        type:
          type: string
          enum: [word, sentence]
        paperId:
          type: [string, 'null']
          format: uuid
          description: 연결된 논문의 내부 id. 논문 없이 요청한 번역이면 null이다. 연결된 논문이 삭제되면 이 이력도 함께 삭제된다.
        createdAt:
          type: string
          format: date-time
    Analysis:
      type: object
      description: |
        논문 분석 결과. 알 수 없는 값은 필드를 빼지 않고 null, 목록은 빈 배열이다.
        `summary`는 `problemShort`, `methodShort`, `conclusionShort`를 줄바꿈으로 이은 한국어 문자열이다.
      required: [paperId, summary, keywords, domain, problemShort, problem, methodShort, method, conclusionShort, conclusion, basic, authors, journalScore, sources]
      properties:
        paperId:
          type: string
          format: uuid
        summary:
          type: string
        keywords:
          type: array
          items:
            type: string
        domain:
          type: [string, 'null']
        problemShort:
          type: [string, 'null']
        problem:
          type: [string, 'null']
        methodShort:
          type: [string, 'null']
        method:
          type: [string, 'null']
        conclusionShort:
          type: [string, 'null']
        conclusion:
          type: [string, 'null']
        basic:
          type: object
          required: [title, year, venue, doi, arxivId, citationCount]
          properties:
            title:
              type: [string, 'null']
            year:
              type: [integer, 'null']
            venue:
              type: [string, 'null']
            doi:
              type: [string, 'null']
            arxivId:
              type: [string, 'null']
            citationCount:
              type: [integer, 'null']
        authors:
          type: array
          maxItems: 3
          items:
            type: object
            required: [name, hIndex, citationCount]
            properties:
              name:
                type: string
              hIndex:
                type: [integer, 'null']
              citationCount:
                type: [integer, 'null']
        journalScore:
          type: object
          description: SCImago 순위표에서 찾은 저널 점수. 찾지 못하면 여섯 값이 모두 null이다.
          required: [matchedTitle, sjr, quartile, issn, type, country]
          properties:
            matchedTitle:
              type: [string, 'null']
            sjr:
              type: [number, 'null']
            quartile:
              type: [string, 'null']
            issn:
              type: [string, 'null']
            type:
              type: [string, 'null']
            country:
              type: [string, 'null']
        sources:
          type: object
          required: [pdf, semanticScholar]
          properties:
            pdf:
              type: boolean
            semanticScholar:
              type: boolean
    BriefingListItem:
      type: object
      required: [id, date, summary]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        summary:
          type: string
    BriefingDetail:
      allOf:
        - $ref: '#/components/schemas/BriefingListItem'
        - type: object
          required: [body, paperIds]
          properties:
            body:
              type: string
            paperIds:
              type: array
              items:
                type: string
                format: uuid

  responses:
    InvalidRequest:
      description: 400 `invalid_request`. 필수 필드가 빠졌거나 값이 잘못된 요청.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 401 `unauthenticated`. 세션이 없거나 유효하지 않다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: 401 `invalid_credentials`. 이메일이 없는 경우와 비밀번호가 틀린 경우를 구분하지 않는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrigin:
      description: 403 `forbidden_origin`. 출처(Origin)가 다른 쓰기 요청. 프레임워크의 일반 텍스트 응답이 아니라 공통 오류 형식으로 돌려준다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PendingApproval:
      description: 403 `pending_approval`. 승인 전 계정. 세션 쿠키를 설정하지 않는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmailTaken:
      description: 409 `email_taken`. 이미 가입된 이메일.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ZoteroNotConnected:
      description: 409 `zotero_not_connected`. Zotero를 연결하지 않았다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ZoteroUnavailable:
      description: 502 `zotero_unavailable`. Zotero에 연결할 수 없거나 Zotero가 오류를 돌려줬다(키가 폐기된 경우 포함). 본문에 Zotero 응답 원문이나 키는 없다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaperNotFound:
      description: 404 `paper_not_found`. 없는 논문이거나 다른 사용자의 논문이다(존재 여부를 드러내지 않는다).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileNotFound:
      description: 404 `paper_not_found` 또는 `attachment_not_found`. 논문이 없거나 첨부가 없다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AnalysisNotFound:
      description: 404 `analysis_not_found`. 분석되지 않은 논문.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BriefingNotFound:
      description: 404 `briefing_not_found`. 없는 브리핑이거나 다른 사용자의 브리핑이다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 413 `payload_too_large`. 메모 본문 1 MB 초과 또는 번역 `text` 5000자 초과.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AiUnavailable:
      description: 502 `ai_unavailable`. AI 모델이 첫 글자 전에 실패했거나(일시 장애, 호출 제한) 빈 응답을 돌려줬다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AiNotConfigured:
      description: 503 `ai_not_configured`. 서버에 AI 모델의 키나 주소가 설정되어 있지 않다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamUnavailable:
      description: 502 `upstream_unavailable`. AI 또는 Semantic Scholar가 응답하지 않는다. 외부 서비스의 응답 내용은 담지 않는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoSourceForAnalysis:
      description: 422 `no_source_for_analysis`. 분석에 쓸 PDF도 Semantic Scholar 정보도 없다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: 429 `too_many_attempts`. 같은 IP에서 15분 안에 5번 실패 후 시도.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
